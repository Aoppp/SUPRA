services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/dolphin.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - app_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
